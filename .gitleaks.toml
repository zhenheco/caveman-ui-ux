# gitleaks configuration for caveman-ui-ux.
#
# The only exemption is the redaction test. `redactSecrets()` exists to keep credentials out
# of generated reports, and the only way to prove it works is to feed it strings that look
# exactly like credentials:
#
#   assert.ok(!redactSecrets('{"token":"ghp_0123456789abcdefghij"}').includes('ghp_…'))
#
# Those literals are synthetic and are asserted to be ABSENT from the output. The allowlist is
# scoped to that one file on purpose — do not widen it. A real secret anywhere else in this
# repository must still fail the scan.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=|\?=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''
[rules.allowlist]
description = "Synthetic credential literals asserted to be redacted"
paths = ['''^scripts/tests/report\.test\.mjs$''']
